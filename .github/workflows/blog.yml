name: Blog

on:
  schedule:
    - cron: '17 5,9,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation
        run: pip install anthropic

      - name: Veille, rédaction et relecture
        id: article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          BLOG_TRIAGE_MODEL: ${{ vars.BLOG_TRIAGE_MODEL }}
        run: python .github/scripts/blog_article.py

      - uses: actions/setup-node@v4
        if: steps.article.outputs.action == 'new' || steps.article.outputs.action == 'update'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: veilix-frontend/package-lock.json

      - name: Vérification du build
        if: steps.article.outputs.action == 'new' || steps.article.outputs.action == 'update'
        working-directory: veilix-frontend
        run: |
          npm ci
          npm run build

      - name: Publication
        if: steps.article.outputs.action == 'new' || steps.article.outputs.action == 'update'
        env:
          ACTION: ${{ steps.article.outputs.action }}
          ORGANIZATION: ${{ steps.article.outputs.organization }}
        run: |
          git config user.name VeilixHQ
          git config user.email unknown.13kr@gmail.com
          git add veilix-frontend/content/blog
          if [ "$ACTION" = "new" ]; then
            git commit -m "Article sur la fuite de données chez $ORGANIZATION"
          else
            git commit -m "Mise à jour de l'article sur la fuite chez $ORGANIZATION"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Indexation
        if: steps.article.outputs.action == 'new' || steps.article.outputs.action == 'update'
        env:
          SLUG: ${{ steps.article.outputs.slug }}
        run: |
          set -euo pipefail
          URL="https://veilix.fr/blog/$SLUG"
          sleep 240
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$URL"; then
              break
            fi
            sleep 30
          done
          curl -fsS -o /dev/null "$URL"
          KEY=780c24ab83dc432dcefdb32571693a13
          BODY=$(jq -nc --arg key "$KEY" --arg url "$URL" '{host:"veilix.fr",key:$key,keyLocation:("https://veilix.fr/"+$key+".txt"),urlList:[$url,"https://veilix.fr/blog","https://veilix.fr/fuites-de-donnees","https://veilix.fr/sitemap.xml","https://veilix.fr/news-sitemap.xml"]}')
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "Réponse IndexNow : $CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
